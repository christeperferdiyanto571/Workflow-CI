name: MLflow CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas numpy matplotlib

      - name: Clean MLflow cache
        run: |
          rm -rf ~/.mlflow
          rm -rf mlruns

      - name: Run MLflow (FORCED LOCAL MODE)
        run: |
          export MLFLOW_TRACKING_URI=file:./mlruns
          export MLFLOW_CONDA_HOME=""
          export MLFLOW_EXPERIMENT_NAME="default"
          mlflow run . --env-manager=local --no-conda
